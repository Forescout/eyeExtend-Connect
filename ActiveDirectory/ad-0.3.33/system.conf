{
  "name": "Active Directory",
  "version": "0.3.33",
  "author": "Clay Colwell",
  "testEnable": true,
  "panels": [
    {
      "title": "Active Directory Connection",
      "description": "One AD domain per connection. Simple LDAP bind authentication.",
      "fields": [
        {
          "display": "AD DNS domain",
          "field ID": "connect_activedirectory_domain",
          "type": "shortString",
          "mandatory": "true",
          "value": "",
          "identifier": "true",
          "add to column": "true",
          "show column": "true"
        },
        {
          "display": "AD NetBIOS domain",
          "field ID": "connect_activedirectory_netbios_domain",
          "type": "shortString",
          "mandatory": "false",
          "value": "",
          "tooltip": "Example: EXAMPLE. Required when matching EXAMPLE\\user or Windows Active Users domain_name. Set the real NetBIOS alias for this AD DNS domain; it is not inferred from the DNS name."
        },
        {
          "display": "Bind identity (UPN or full DN)",
          "field ID": "connect_activedirectory_bind_user",
          "type": "shortString",
          "mandatory": "true",
          "value": ""
        },
        {
          "display": "Bind password",
          "field ID": "connect_activedirectory_password",
          "type": "encrypted",
          "mandatory": "true",
          "value": ""
        },
        {
          "display": "Connection security",
          "field ID": "connect_activedirectory_transport",
          "type": "option",
          "mandatory": "true",
          "value": "ldaps",
          "tooltip": "LDAPS and StartTLS always encrypt the connection. Validate server certificate controls certificate checks using Forescout's certificate and CRL stores; unchecking it disables server identity validation.",
          "options": [
            {
              "display": "LDAPS (TLS from connection start)",
              "value": "ldaps"
            },
            {
              "display": "LDAP with required StartTLS",
              "value": "starttls"
            },
            {
              "display": "Plaintext LDAP (credentials and data unencrypted)",
              "value": "ldap"
            }
          ]
        },
        {
          "certification validation": true
        },
        {
          "display": "Check certificate revocation (CRL)",
          "field ID": "connect_activedirectory_check_crl",
          "type": "boolean",
          "mandatory": "false",
          "value": "true",
          "tooltip": "Applies only when Validate server certificate is enabled for LDAPS or StartTLS. Enabled by default; requires current CRLs in Forescout's CRL store. Disabling skips revocation checks but still validates the certificate chain, validity dates, and server hostname using Forescout's trust store. Revoked certificates may then be accepted."
        }
      ]
    },
    {
      "focal appliance": true,
      "title": "Assign CounterACT Devices",
      "description": "Select the appliance that connects directly to the domain controllers and DNS resolvers."
    },
    {
      "title": "Servers and Failover",
      "description": "Choose domain controllers or DNS discovery, then configure connection timeouts.",
      "fields": [
        {
          "display": "Find domain controllers",
          "field ID": "connect_activedirectory_discovery",
          "type": "option",
          "mandatory": "true",
          "value": "servers",
          "options": [
            {
              "display": "Configured AD servers in order",
              "value": "servers"
            },
            {
              "display": "DNS SRV discovery",
              "value": "dns"
            }
          ]
        },
        {
          "display": "AD servers",
          "field ID": "connect_activedirectory_servers",
          "type": "longString",
          "mandatory": "false",
          "value": "",
          "tooltip": "Comma/newline separated hostnames or IPs, optionally host:port or [IPv6]:port. Used in configured-server mode."
        },
        {
          "display": "DNS resolver IPs",
          "field ID": "connect_activedirectory_dns_servers",
          "type": "longString",
          "mandatory": "false",
          "value": "",
          "tooltip": "Required for DNS discovery. Queries _ldap._tcp.dc._msdcs.<AD DNS domain>. Comma/newline separated IPs; optional port."
        },
        {
          "display": "Port override (0 = automatic)",
          "field ID": "connect_activedirectory_port",
          "type": "shortString",
          "mandatory": "true",
          "value": "0",
          "tooltip": "Enter 0 for automatic selection, or a port from 1 to 65535. Automatic: LDAPS 636; LDAP/StartTLS 389 or advertised SRV port. An explicit server port takes precedence."
        },
        {
          "display": "Socket timeout (seconds)",
          "field ID": "connect_activedirectory_timeout",
          "type": "integer",
          "mandatory": "true",
          "value": 5
        },
        {
          "display": "Operation time budget (seconds)",
          "field ID": "connect_activedirectory_total_timeout",
          "type": "integer",
          "mandatory": "true",
          "value": 25
        }
      ]
    },
    {
      "title": "Object Search",
      "description": "Optionally limit computer and user searches to specific directory base DNs.",
      "fields": [
        {
          "display": "Computer search base DN (optional)",
          "field ID": "connect_activedirectory_computer_base",
          "type": "shortString",
          "mandatory": "false",
          "value": "",
          "tooltip": "Blank uses the domain naming context. Restrict to a computer OU if appropriate."
        },
        {
          "display": "User search base DN (optional)",
          "field ID": "connect_activedirectory_user_base",
          "type": "shortString",
          "mandatory": "false",
          "value": "",
          "tooltip": "Blank uses the domain naming context. Restrict to a user OU if appropriate."
        }
      ]
    },
    {
      "title": "Computer Group Whitelist",
      "description": "Only the listed full group DNs may be changed for matched computer accounts, including cancellation undo. An empty list blocks all group changes. WARNING: Allowing any group is dangerous and may permit privilege escalation wherever the bind account has write access. Enable it only if intended.",
      "fields": [
        {
          "display": "Allowed computer group DNs (one per line)",
          "field ID": "connect_activedirectory_computer_group_whitelist",
          "type": "longString",
          "mandatory": "false",
          "value": "",
          "tooltip": "Enter one full group DN per line. Blank blocks changes. Do not separate DNs with commas or semicolons. Applies to add, remove, and cancellation undo; group reporting is unaffected."
        },
        {
          "display": "Allow adding/removing computer accounts to/from any group (DANGEROUS)",
          "field ID": "connect_activedirectory_computer_allow_any_group",
          "type": "boolean",
          "mandatory": "false",
          "value": "false",
          "tooltip": "Disabled by default. Explicitly bypasses this object's group whitelist, including for cancellation undo. Can grant privileged access. The configured AD domain and bind permissions still apply."
        }
      ]
    },
    {
      "title": "User Group Whitelist",
      "description": "Only the listed full group DNs may be changed for matched user accounts, including cancellation undo. An empty list blocks all group changes. WARNING: Allowing any group is dangerous and may permit privilege escalation wherever the bind account has write access. Enable it only if intended.",
      "fields": [
        {
          "display": "Allowed user group DNs (one per line)",
          "field ID": "connect_activedirectory_user_group_whitelist",
          "type": "longString",
          "mandatory": "false",
          "value": "",
          "tooltip": "Enter one full group DN per line. Blank blocks changes. Do not separate DNs with commas or semicolons. Applies to add, remove, and cancellation undo; group reporting is unaffected."
        },
        {
          "display": "Allow adding/removing user accounts to/from any group (DANGEROUS)",
          "field ID": "connect_activedirectory_user_allow_any_group",
          "type": "boolean",
          "mandatory": "false",
          "value": "false",
          "tooltip": "Disabled by default. Explicitly bypasses this object's group whitelist, including for cancellation undo. Can grant privileged access. The configured AD domain and bind permissions still apply."
        }
      ]
    }
  ]
}
