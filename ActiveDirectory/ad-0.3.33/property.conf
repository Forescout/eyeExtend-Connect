      "undo": {
        "label": "Cancel AD computer group add",
        "description": "Restore the original membership only if this action changed it, undo was enabled, and the group is still permitted by the connection's current whitelist."
      },
      "params": [
        {
          "name": "connect_activedirectory_group_dn",
          "label": "Full group DN",
          "type": "string",
          "description": "Example: CN=Managed Devices,OU=Groups,DC=example,DC=test",
          "default": ""
        },
        {
          "name": "connect_activedirectory_undo_on_cancel",
          "label": "Undo when action cancelled",
          "type": "boolean",
          "description": "Restore prior membership when this action is cancelled. Uncheck to retain the change.",
          "default": "true"
