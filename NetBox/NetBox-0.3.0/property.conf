      "label": "NetBox Status",
      "description": "Result of looking the endpoint up in NetBox: documented, other_ip (the MAC is recorded under another IP address), mac_mismatch (the IP address is recorded for another MAC), not_found_private_mac (not recorded, and the endpoint uses a private/random MAC) or not_found.",
