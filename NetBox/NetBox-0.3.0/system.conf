{
    "name": "NetBox",
    "version": "0.3.0",
    "author": "Arturo Guillen",
    "testEnable": true,
    "panels": [
        {
            "title": "NetBox Connection",
            "description": "NetBox server that holds the IP address plan (IPAM)",
            "fields": [
                {
                    "display": "NetBox URL",
                    "field ID": "connect_netbox_url",
                    "type": "shortString",
                    "mandatory": "true",
                    "add to column": "true",
                    "show column": "true",
                    "identifier": "true",
                    "tooltip": "For example https://netbox.example.com (without /api).",
                    "value": "https://"
                },
                {
                    "display": "API Token",
                    "field ID": "connect_netbox_token",
                    "type": "encrypted",
                    "mandatory": "true",
                    "tooltip": "Read access is enough for the properties. The Add to NetBox action also needs permission to add IP addresses and a write-enabled token. NetBox 4.5+ tokens (nbt_...) and older 40-character tokens are both accepted.",
                    "value": ""
                },
                {
                    "certification validation": true
                }
            ]
        },
        {
            "focal appliance": true,
            "title": "Assign eyeSight Devices",
            "description": "<html>Select the connecting eyeSight device that will communicate with this NetBox server, including requests by other eyeSight devices. Specific eyeSight devices assigned here cannot be assigned to another server elsewhere.<br><br>If you do not assign specific devices, by default, all devices will be assigned to one server. This server becomes known as the Default Server.<html>"
        },
        {
            "title": "NetBox Options",
            "description": "Options for the NetBox App",
            "fields": [
                {
                    "display": "Also read MAC addresses written in the description or comments of an IP address",
                    "field ID": "connect_netbox_mac_in_text",
                    "type": "boolean",
                    "mandatory": "false",
                    "add to column": "true",
                    "show column": "false",
                    "tooltip": "Useful when IP addresses are recorded without interfaces.",
                    "value": "true"
                },
                {
                    "rate limiter": true,
                    "display": "Number of API queries per second",
                    "type": "integer",
                    "unit": 1,
                    "min": 1,
                    "max": 1000,
                    "add to column": "true",
                    "show column": "false",
                    "value": 50
                }
            ]
        }
    ]
}
