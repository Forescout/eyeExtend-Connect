{
  "name": "DNSQueries",
  "version": "1.0.0",
  "author": "Custom integration for Arturo",
  "testEnable": true,
  "focal only syslog": false,
  "panels": [
    {
      "title": "DNS Queries",
      "description": "Keep up to 20 distinct domains per client IP for seven days. By default, DNS data is returned only for endpoints whose Function is Unknown; choose All devices only when that wider scope is intended. Configure periodic policy rechecks for expiry on idle devices.",
      "fields": [
        {
          "field ID": "connect_dnsqueries_source_name",
          "display": "Source name",
          "type": "shortString",
          "mandatory": "true",
          "identifier": "true",
          "add to column": "true",
          "show column": "true"
        },
        {
          "field ID": "connect_dnsqueries_format",
          "display": "DNS log format",
          "type": "option",
          "mandatory": "true",
          "value": "dnsmasq",
          "options": [
            {
              "display": "dnsmasq",
              "value": "dnsmasq"
            },
            {
              "display": "Automatic: dnsmasq or BIND",
              "value": "auto"
            },
            {
              "display": "BIND query log",
              "value": "bind"
            },
            {
              "display": "Normalized JSON",
              "value": "json"
            },
            {
              "display": "Custom query expression",
              "value": "custom"
            }
          ]
        },
        {
          "field ID": "connect_dnsqueries_scope",
          "display": "Target devices",
          "type": "option",
          "mandatory": "true",
          "value": "unknown_function",
          "tooltip": "Unknown Function only is the safe default for large deployments: events are retained, but DNS domains are returned only when Forescout resolves an endpoint whose Function is Unknown. Choose All devices only when DNS visibility is required for every endpoint.",
          "options": [
            {
              "display": "All devices",
              "value": "all"
            },
            {
              "display": "Only devices with Function = Unknown",
              "value": "unknown_function"
            }
          ]
        },
        {
          "field ID": "connect_dnsqueries_regex",
          "display": "Custom query expression",
          "type": "longString",
          "mandatory": "false",
          "tooltip": "Custom mode only. Use fixed text plus (?P<client_ip>\\S+), (?P<domain>\\S+) (or \\d+/\\w+), in either order, separated by fixed text and ending in $."
        }
      ]
    },
    {
      "focal appliance": true,
      "title": "Assign Forescout Devices",
      "description": "Select the connecting appliance. Syslog processing is enabled on all appliances so host property resolves can use locally retained data."
    },
    {
      "syslog source": true,
      "title": "Syslog Source",
      "description": "Enable Use Syslog Source and enter the DNS server or relay source IP/name. For the supplied capture, use 192.168.2.98. Configure each source once."
    }
  ]
}
