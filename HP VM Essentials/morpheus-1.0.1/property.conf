      "undo": {
        "label": "Restore Power State",
        "description": "Restore the power state recorded before Start VM; leave an unchanged VM alone"
      }
    },
    {
      "name": "connect_hpvme_stop",
      "label": "Stop VM (Graceful)",
      "group": "connect_hpvme_actions",
      "description": "Gracefully shut down the VM. If the guest does not stop within five minutes, the VM stays running",
      "ip_required": false,
      "dependencies": [
        {
          "name": "connect_hpvme_server_id",
          "redo_new": true,
          "redo_change": true
        },
