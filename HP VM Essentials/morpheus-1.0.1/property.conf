          "redo_new": true,
          "redo_change": true
        }
      ],
      "undo": {
        "label": "Restore Power State",
        "description": "Restore the power state recorded before Stop VM; leave an unchanged VM alone"
      }
    },
    {
      "name": "connect_hpvme_force_stop",
      "label": "Force Power Off VM",
      "group": "connect_hpvme_actions",
      "description": "Immediately power off the VM without a guest shutdown. Unsaved data in the VM can be lost",
      "ip_required": false,
      "dependencies": [
        {
          "name": "connect_hpvme_server_id",
          "redo_new": true,
          "redo_change": true
        },
