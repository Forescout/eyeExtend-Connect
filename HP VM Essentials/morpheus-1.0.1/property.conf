    {
      "name": "connect_hpvme_start",
      "label": "Start VM",
      "group": "connect_hpvme_actions",
      "description": "Start a stopped or suspended VM (also resumes a suspended VM)",
      "ip_required": false,
      "dependencies": [
        {
          "name": "connect_hpvme_server_id",
          "redo_new": true,
