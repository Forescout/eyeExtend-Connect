{
  "name": "HP VME",
  "version": "1.0.1",
  "author": "Forescout Community",
  "testEnable": true,
  "panels": [
    {
      "title": "HP VME Connection",
      "description": "HP VME Connection",
      "fields": [
        {
          "display": "Manager URL",
          "field ID": "connect_hpvme_url",
          "type": "longString",
          "mandatory": "true",
          "add to column": "true",
          "show column": "true",
          "identifier": "true",
          "tooltip": "Base URL of the VM Essentials manager (e.g. https://192.168.1.140). To add another manager, create a separate entry."
        },
        {
          "display": "Username",
          "field ID": "connect_hpvme_username",
          "type": "longString",
          "mandatory": "true",
          "add to column": "true",
          "show column": "false",
          "tooltip": "VM Essentials user for this manager. Use a dedicated service account. Its role must allow VM power, snapshot, lock, and tag operations if you use those actions."
        },
        {
          "display": "Password",
          "field ID": "connect_hpvme_password",
          "type": "encrypted",
          "mandatory": "true",
          "tooltip": "Password for this user."
        },
        {
          "certification validation": true
        },
        {
          "enable controller routing": true
        },
        {
          "controller config field name": true,
          "value": "connect_hpvme_url",
          "tooltip": "The app field name that holds the manager URL"
        }
      ]
    },
    {
      "focal appliance": true,
      "title": "Assign CounterACT Devices",
      "description": "<html>Select the connecting CounterACT device that will communicate with the targeted HP VME manager, including requests by other CounterACT devices. Specific CounterACT devices assigned here cannot be assigned to another server elsewhere.<br><br>If you do not assign specific devices, by default, all devices will be assigned to one server. This server becomes known as the Default Server.<html>"
    },
    {
      "proxy server": true,
      "title": "Proxy Server",
      "description": "<html>Select a Proxy Server device to manage all communication between CounterACT and HP VME.<html>"
    },
    {
      "title": "HP VME Options",
      "description": "HP VME Options",
      "fields": [
        {
          "host discovery": true,
          "display": "Discovery Frequency (in minutes)",
          "max": 43200,
          "add to column": "true",
          "show column": "false",
          "value": 10
        },
        {
          "rate limiter": true,
          "display": "Number of API queries per second",
          "unit": 1,
          "min": 1,
          "max": 100,
          "add to column": "true",
          "show column": "false",
          "value": 10
        }
      ]
    }
  ]
}