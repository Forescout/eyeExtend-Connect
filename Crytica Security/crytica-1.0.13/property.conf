      "label": "Crytica Security",
      "display": "Crytica Security",
      "description": "Crytica Security policy templates",
      "full_description": "<html>Use Crytica Security policy templates to classify and act on endpoints based on security-scan alerts pushed from Crytica Security.</html>",
