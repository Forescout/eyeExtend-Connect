    },
    "policies": [
      {
        "name": "connect_cryticasecurity_alert_types_policy",
        "label": "Crytica Security Endpoints by Alert Types",
        "display": "Crytica Security Endpoints by Alert Types Policy",
        "help": "Crytica Security Policy",
        "description": "Creates a policy that classifies endpoints by Crytica Security alert type",
        "file_name": "CryticaSecurityEndpointsByAlertTypes.xml",
        "full_description": "<html>Use this policy template to classify endpoints by their current Crytica Security alert type: Element Added, Element Deleted, Element Modified, or No Alerts.</html>",
        "title_image": "connect_cryticasecurity.png"
      },
      {
        "name": "connect_cryticasecurity_last_security_scan_policy",
        "label": "Crytica Security Endpoints by Last Security Scan",
        "display": "Crytica Security Endpoints by Last Security Scan Policy",
        "help": "Crytica Security Policy",
        "description": "Creates a policy that classifies endpoints by recent Crytica Security scan evidence",
        "file_name": "CryticaSecurityEndpointsByLastSecurityScan.xml",
        "full_description": "<html>Use this policy template to classify endpoints by the age of their most recent Crytica Security scan evidence, including no scan data, more than 30 days, 7 to 30 days, or within 7 days.</html>",
        "title_image": "connect_cryticasecurity.png"
      },
      {
        "name": "connect_cryticasecurity_os_types_policy",
        "label": "Crytica Security Endpoints by OS Types",
        "display": "Crytica Security Endpoints by OS Types Policy",
        "help": "Crytica Security Policy",
        "description": "Creates a policy that classifies endpoints by their Crytica Security-reported operating system",
        "file_name": "CryticaSecurityEndpointsByOSTypes.xml",
        "full_description": "<html>Use this policy template to classify endpoints with Crytica Security alert data as Windows, Linux, macOS, or another reported operating system type.</html>",
        "title_image": "connect_cryticasecurity.png"
      }
