{
  "name": "Crytica Security",
  "version": "1.0.13",
  "author": "Upstart Cyber",
  "testEnable": true,
  "web service": true,
  "appDescription": "Receives Crytica Security scan alerts pushed into Forescout via the Connect web API. Each inbound message is keyed by endpoint IP and populates individual Crytica Security alert properties so alerts can be used in Forescout policies, the Asset Inventory, and reporting.",
  "panels": [
    {
      "title": "Crytica Security Connection",
      "description": "<html>Crytica Security pushes alerts into Forescout using the Connect web API; Forescout does not call out to Crytica Security. Use the field below to label this Crytica Security source. The web API credentials that Crytica Security uses to authenticate are managed separately under the Forescout Connect web service settings.</html>",
      "fields": [
        {
          "display": "Crytica Security Source Label",
          "field ID": "connect_cryticasecurity_source_label",
          "type": "shortString",
          "mandatory": "true",
          "add to column": "true",
          "show column": "true",
          "identifier": "true",
          "value": "Crytica Security",
          "tooltip": "A friendly label identifying this Crytica Security source (e.g. the Crytica Security console name). Used only for display in the Connect configuration table."
        }
      ]
    },
    {
      "focal appliance": true,
      "title": "Assign CounterACT Devices",
      "description": "<html>Select the connecting CounterACT device that will receive Crytica Security alert messages for this source, including requests by other CounterACT devices. Specific CounterACT devices assigned here cannot be assigned to another source elsewhere.<br><br>If you do not assign specific devices, by default, all devices will be assigned to one source. This source becomes known as the Default Server.</html>"
    }
  ]
}
